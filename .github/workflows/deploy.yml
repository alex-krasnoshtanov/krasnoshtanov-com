name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # The paths filter is deliberately absent. Everything in this repo either
  # is the page or gates the page, so there is nothing a push could touch
  # that should skip the checks.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm run build` is check --data, then astro build, then check --dist.
      # The gates are inside the build script rather than separate steps so
      # that `npm run build` locally cannot pass where CI would fail.
      - run: npm run build

      - run: npx astro check

      # Deploy only from main, and only after the gates. The Worker's git
      # integration in the Cloudflare dashboard MUST stay off: with it on,
      # Cloudflare builds straight from the push and every gate above is
      # skipped silently.
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deployed page that 404s its own CV link is the one failure a
      # recruiter is guaranteed to hit, so it is checked against the live
      # site rather than the build output.
      - name: Verify the live CV redirect
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://krasnoshtanov.com/cv.pdf || true)
            echo "attempt $i: /cv.pdf -> $code"
            case "$code" in
              30[12378])
                target=$(curl -s -o /dev/null -w '%{redirect_url}' https://krasnoshtanov.com/cv.pdf)
                echo "redirects to $target"
                pdf=$(curl -sL -o /dev/null -w '%{http_code}' "$target")
                test "$pdf" = "200" || { echo "::error::the CV redirect target returned $pdf"; exit 1; }
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::/cv.pdf did not redirect after 5 attempts"
          exit 1
